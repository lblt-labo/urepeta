<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>うれペタ｜手売り・対面販売のための在庫＆売上管理</title>
<meta name="description" content="対面販売・ハンドメイド出店向けの在庫・売上管理アプリ。シールを貼る感覚で在庫を記録し、おつり計算やCSV出力もその場でできます。" />
<link rel="icon" href="data:," />

<!-- React (UMD) -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<!-- Babel Standalone（ブラウザ上でJSXをその場で変換） -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

<style>
  html, body { margin: 0; padding: 0; background: #F2E8D6; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
/* =========================================================================
   在庫・売上管理アプリ（対面販売・ハンドメイド出店向け）
   - イベント（出店・マルシェ等）ごとにプロジェクトを作成
   - 商品ごとにマス目（グリッド）で在庫・販売数を「シール」感覚で記録
   - おつり計算機能
   - 集計（イベント別・商品別）
   - 色覚特性に配慮し、色だけでなく「形」「模様」でも識別可能
   ========================================================================= */

const { useState, useEffect, useRef, useCallback, useMemo } = React;

const STORAGE_KEY = "urepeta:data";

const SHAPES = [
  { id: "circle", label: "丸" },
  { id: "square", label: "四角" },
  { id: "triangle", label: "三角" },
  { id: "star", label: "星" },
];

const PATTERNS = [
  { id: "solid", label: "べた塗り" },
  { id: "diagonal", label: "斜線" },
  { id: "dot", label: "ドット" },
  { id: "grid", label: "格子" },
];

// Okabe–Ito colorblind-safe palette
const COLORS = [
  { id: "orange", hex: "#E69F00", label: "オレンジ" },
  { id: "skyblue", hex: "#56B4E9", label: "スカイブルー" },
  { id: "green", hex: "#009E73", label: "グリーン" },
  { id: "blue", hex: "#0072B2", label: "ブルー" },
  { id: "vermillion", hex: "#D55E00", label: "バーミリオン" },
  { id: "purple", hex: "#CC79A7", label: "パープル" },
  { id: "yellow", hex: "#C8A400", label: "イエロー" },
  { id: "black", hex: "#3A3A3A", label: "ブラック" },
];

function uid(prefix = "id") {
  return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
}

function yen(n) {
  const v = Number.isFinite(n) ? n : 0;
  return `¥${v.toLocaleString("ja-JP")}`;
}

function makeCells(count) {
  return new Array(Math.max(0, count)).fill(false);
}

function makeTimes(count) {
  return new Array(Math.max(0, count)).fill(null);
}

function nowTimeStr() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function csvEscape(value) {
  const str = String(value ?? "");
  if (/[",\n]/.test(str)) {
    return `"${str.replace(/"/g, '""')}"`;
  }
  return str;
}

function downloadCsv(filename, rows) {
  const csvBody = rows.map((row) => row.map(csvEscape).join(",")).join("\r\n");
  const csvContent = "\uFEFF" + csvBody; // BOM for Excel(日本語)対応
  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function defaultProduct(overrides = {}) {
  const usedColorIdx = overrides._colorIdx ?? 0;
  const stock = overrides.stock ?? 30;
  return {
    id: uid("prod"),
    name: "",
    price: 500,
    stock,
    cells: makeCells(stock),
    cellTimes: makeTimes(stock),
    shape: SHAPES[usedColorIdx % SHAPES.length].id,
    color: COLORS[usedColorIdx % COLORS.length].hex,
    pattern: PATTERNS[0].id,
    ...overrides,
  };
}

function defaultEvent(overrides = {}) {
  return {
    id: uid("evt"),
    name: "",
    date: "",
    venue: "",
    products: [],
    ...overrides,
  };
}

/* ---------------------------- Seal (SVG) -------------------------------- */

function Seal({ shape, color, pattern, filled, size = 34, dim = false }) {
  const patId = `pat_${shape}_${pattern}_${color.replace("#", "")}`;
  const strokeColor = filled ? color : "#7A6340";
  const fillValue = filled ? (pattern === "solid" ? color : `url(#${patId})`) : "none";

  const shapeProps = {
    fill: fillValue,
    stroke: strokeColor,
    strokeWidth: filled ? 2 : 2,
    strokeDasharray: filled ? "none" : "3.2 3.2",
    opacity: dim ? 0.45 : 1,
  };

  let shapeEl = null;
  if (shape === "circle") {
    shapeEl = <circle cx="20" cy="20" r="16" {...shapeProps} />;
  } else if (shape === "square") {
    shapeEl = <rect x="5" y="5" width="30" height="30" rx="6" {...shapeProps} />;
  } else if (shape === "triangle") {
    shapeEl = <polygon points="20,4 36,33 4,33" strokeLinejoin="round" {...shapeProps} />;
  } else {
    shapeEl = (
      <polygon
        points="20,3 23.6,14.6 36,14.6 26.1,21.9 29.7,33.6 20,26.2 10.3,33.6 13.9,21.9 4,14.6 16.4,14.6"
        strokeLinejoin="round"
        {...shapeProps}
      />
    );
  }

  return (
    <svg width={size} height={size} viewBox="0 0 40 40" style={{ overflow: "visible" }}>
      <defs>
        <pattern id={patId} width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="7" height="7" fill="#FBF5E9" />
          {pattern === "diagonal" && <rect x="0" y="0" width="3" height="7" fill={color} />}
          {pattern === "dot" && <circle cx="3.5" cy="3.5" r="2" fill={color} />}
          {pattern === "grid" && (
            <>
              <rect x="0" y="0" width="7" height="2" fill={color} />
              <rect x="0" y="0" width="2" height="7" fill={color} />
            </>
          )}
        </pattern>
      </defs>
      {shapeEl}
    </svg>
  );
}

/* ------------------------------- App ------------------------------------ */

function App() {
  const [events, setEvents] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [view, setView] = useState("events"); // 'events' | 'event' | 'product'
  const [currentEventId, setCurrentEventId] = useState(null);
  const [currentProductId, setCurrentProductId] = useState(null);

  const [showAddEvent, setShowAddEvent] = useState(false);
  const [showAddProduct, setShowAddProduct] = useState(false);
  const [confirmDialog, setConfirmDialog] = useState(null); // {message, onConfirm}
  const [vibrationEnabled, setVibrationEnabled] = useState(true);

  const saveTimer = useRef(null);

  // ---- load (localStorage) ----
  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.events)) setEvents(parsed.events);
        if (parsed && parsed.settings && typeof parsed.settings.vibrationEnabled === "boolean") {
          setVibrationEnabled(parsed.settings.vibrationEnabled);
        }
      }
    } catch (e) {
      // no saved data yet, or corrupted — start fresh
    } finally {
      setLoaded(true);
    }
  }, []);

  // ---- debounced save (localStorage) ----
  useEffect(() => {
    if (!loaded) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ events, settings: { vibrationEnabled } }));
      } catch (e) {
        console.error("save failed", e);
      }
    }, 400);
    return () => clearTimeout(saveTimer.current);
  }, [events, vibrationEnabled, loaded]);

  function doVibrate() {
    if (!vibrationEnabled) return;
    try {
      if (navigator && typeof navigator.vibrate === "function") {
        navigator.vibrate(30);
      }
    } catch (e) {
      // vibration not supported — ignore
    }
  }

  const currentEvent = useMemo(
    () => events.find((e) => e.id === currentEventId) || null,
    [events, currentEventId]
  );
  const currentProduct = useMemo(
    () => (currentEvent ? currentEvent.products.find((p) => p.id === currentProductId) : null) || null,
    [currentEvent, currentProductId]
  );

  const updateEvent = useCallback((eventId, updater) => {
    setEvents((prev) => prev.map((e) => (e.id === eventId ? updater(e) : e)));
  }, []);

  const updateProduct = useCallback(
    (eventId, productId, updater) => {
      updateEvent(eventId, (e) => ({
        ...e,
        products: e.products.map((p) => (p.id === productId ? updater(p) : p)),
      }));
    },
    [updateEvent]
  );

  function goEvents() {
    setView("events");
    setCurrentEventId(null);
    setCurrentProductId(null);
  }
  function openEvent(id) {
    setCurrentEventId(id);
    setView("event");
    setCurrentProductId(null);
  }
  function openProduct(id) {
    setCurrentProductId(id);
    setView("product");
  }
  function backFromProduct() {
    setView("event");
    setCurrentProductId(null);
  }

  function addEvent(data) {
    const ev = defaultEvent(data);
    setEvents((prev) => [ev, ...prev]);
    setShowAddEvent(false);
    openEvent(ev.id);
  }

  function addProduct(data) {
    const idx = currentEvent ? currentEvent.products.length : 0;
    const prod = defaultProduct({ ...data, _colorIdx: idx });
    updateEvent(currentEvent.id, (e) => ({ ...e, products: [...e.products, prod] }));
    setShowAddProduct(false);
  }

  function deleteEvent(id) {
    setConfirmDialog({
      title: "イベントを削除",
      message: "このイベントと、登録されている商品・記録がすべて削除されます。よろしいですか？",
      danger: true,
      onConfirm: () => {
        setEvents((prev) => prev.filter((e) => e.id !== id));
        if (currentEventId === id) goEvents();
        setConfirmDialog(null);
      },
    });
  }

  function deleteProduct(eventId, productId) {
    setConfirmDialog({
      title: "商品を削除",
      message: "この商品の在庫・販売記録が削除されます。よろしいですか？",
      danger: true,
      onConfirm: () => {
        updateEvent(eventId, (e) => ({ ...e, products: e.products.filter((p) => p.id !== productId) }));
        setConfirmDialog(null);
        if (currentProductId === productId) backFromProduct();
      },
    });
  }

  function resetProductSales(eventId, productId) {
    setConfirmDialog({
      title: "販売記録をリセット",
      message: "この商品のシール（販売記録）をすべて未販売の状態に戻します。よろしいですか？",
      danger: true,
      onConfirm: () => {
        updateProduct(eventId, productId, (p) => ({ ...p, cells: makeCells(p.stock), cellTimes: makeTimes(p.stock) }));
        setConfirmDialog(null);
      },
    });
  }

  function toggleCell(eventId, productId, index) {
    let becameSold = false;
    updateProduct(eventId, productId, (p) => {
      const cells = p.cells.slice();
      const cellTimes = (p.cellTimes && p.cellTimes.length === p.cells.length
        ? p.cellTimes
        : makeTimes(p.cells.length)
      ).slice();
      const newValue = !cells[index];
      cells[index] = newValue;
      cellTimes[index] = newValue ? nowTimeStr() : null;
      becameSold = newValue;
      return { ...p, cells, cellTimes };
    });
    if (becameSold) doVibrate();
  }

  function sellQty(eventId, productId, qty) {
    let anySold = false;
    updateProduct(eventId, productId, (p) => {
      const cells = p.cells.slice();
      const cellTimes = (p.cellTimes && p.cellTimes.length === p.cells.length
        ? p.cellTimes
        : makeTimes(p.cells.length)
      ).slice();
      let remaining = qty;
      const time = nowTimeStr();
      for (let i = 0; i < cells.length && remaining > 0; i++) {
        if (!cells[i]) {
          cells[i] = true;
          cellTimes[i] = time;
          remaining--;
          anySold = true;
        }
      }
      return { ...p, cells, cellTimes };
    });
    if (anySold) doVibrate();
  }

  function addStock(eventId, productId, amount) {
    updateProduct(eventId, productId, (p) => ({
      ...p,
      stock: p.stock + amount,
      cells: [...p.cells, ...makeCells(amount)],
      cellTimes: [...(p.cellTimes || makeTimes(p.cells.length)), ...makeTimes(amount)],
    }));
  }

  return (
    <div className="app-root">
      <GlobalStyle />
      <Header
        view={view}
        eventName={currentEvent?.name}
        productName={currentProduct?.name}
        onBackToEvents={goEvents}
        onBackToEvent={backFromProduct}
        vibrationEnabled={vibrationEnabled}
        onToggleVibration={() => setVibrationEnabled((v) => !v)}
      />

      <main className="main">
        {view === "events" && (
          <EventsListView
            events={events}
            onOpen={openEvent}
            onAdd={() => setShowAddEvent(true)}
            onDelete={deleteEvent}
          />
        )}

        {view === "event" && currentEvent && (
          <EventDetailView
            event={currentEvent}
            onOpenProduct={openProduct}
            onAddProduct={() => setShowAddProduct(true)}
            onDeleteProduct={(pid) => deleteProduct(currentEvent.id, pid)}
          />
        )}

        {view === "product" && currentEvent && currentProduct && (
          <ProductDetailView
            event={currentEvent}
            product={currentProduct}
            onToggleCell={(idx) => toggleCell(currentEvent.id, currentProduct.id, idx)}
            onSell={(qty) => sellQty(currentEvent.id, currentProduct.id, qty)}
            onAddStock={(amt) => addStock(currentEvent.id, currentProduct.id, amt)}
            onReset={() => resetProductSales(currentEvent.id, currentProduct.id)}
            onDelete={() => deleteProduct(currentEvent.id, currentProduct.id)}
          />
        )}
      </main>

      {showAddEvent && (
        <AddEventModal onCancel={() => setShowAddEvent(false)} onSubmit={addEvent} />
      )}
      {showAddProduct && currentEvent && (
        <AddProductModal onCancel={() => setShowAddProduct(false)} onSubmit={addProduct} />
      )}
      {confirmDialog && (
        <ConfirmModal
          {...confirmDialog}
          onCancel={() => setConfirmDialog(null)}
        />
      )}
    </div>
  );
}

/* ------------------------------- Header ---------------------------------- */

function Header({ view, eventName, productName, onBackToEvents, onBackToEvent, vibrationEnabled, onToggleVibration }) {
  let title = "うれペタ";
  let subtitle = "うれたらペタッとうれしいアプリ";
  let onBack = null;

  if (view === "event") {
    title = eventName || "無題のイベント";
    subtitle = "イベント詳細・集計";
    onBack = onBackToEvents;
  } else if (view === "product") {
    title = productName || "無題の商品";
    subtitle = "在庫マス目・おつり計算";
    onBack = onBackToEvent;
  }

  return (
    <header className="header">
      <div className="header-row">
        {onBack ? (
          <button className="icon-btn" onClick={onBack} aria-label="戻る">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M15 5l-7 7 7 7" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" />
            </svg>
          </button>
        ) : (
          <div className="header-mark">
            <Seal shape="star" color="#C8A400" pattern="solid" filled size={26} />
          </div>
        )}
        <div className="header-text">
          <h1>{title}</h1>
          <p>{subtitle}</p>
        </div>
        <button
          className={`vibrate-toggle ${vibrationEnabled ? "vibrate-on" : "vibrate-off"}`}
          onClick={onToggleVibration}
          aria-pressed={vibrationEnabled}
          aria-label={`タップ時の振動を${vibrationEnabled ? "オフ" : "オン"}にする`}
          title={`振動 ${vibrationEnabled ? "ON" : "OFF"}`}
        >
          <VibrateIcon />
          <span className="vibrate-toggle-label">振動{vibrationEnabled ? "ON" : "OFF"}</span>
        </button>
      </div>
    </header>
  );
}

function VibrateIcon() {
  return (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
      <rect x="7" y="4" width="10" height="16" rx="2" stroke="currentColor" strokeWidth="2" />
      <path d="M2 9v6M22 9v6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" />
    </svg>
  );
}

/* --------------------------- Events List View ----------------------------- */

function EventsListView({ events, onOpen, onAdd, onDelete }) {
  const grandTotal = events.reduce(
    (sum, e) => sum + e.products.reduce((s, p) => s + p.cells.filter(Boolean).length * p.price, 0),
    0
  );
  const grandSold = events.reduce(
    (sum, e) => sum + e.products.reduce((s, p) => s + p.cells.filter(Boolean).length, 0),
    0
  );
  const grandStock = events.reduce(
    (sum, e) => sum + e.products.reduce((s, p) => s + p.stock, 0),
    0
  );
  const grandRemaining = grandStock - grandSold;
  const eventCount = events.length;
  const productCount = events.reduce((sum, e) => sum + e.products.length, 0);

  function handleExportCsv() {
    const rows = [["イベント名", "商品名", "単価", "販売時刻"]];
    events.forEach((e) => {
      e.products.forEach((p) => {
        p.cells.forEach((filled, i) => {
          if (filled) {
            const time = (p.cellTimes && p.cellTimes[i]) || "";
            rows.push([e.name || "無題のイベント", p.name || "無題の商品", p.price, time]);
          }
        });
      });
    });
    if (rows.length === 1) {
      rows.push(["（まだ販売記録がありません）", "", "", ""]);
    }
    const stamp = nowTimeStr().replace(/:/g, "");
    downloadCsv(`urepeta_sales_${stamp}.csv`, rows);
  }

  return (
    <div className="view-pad">
      {events.length > 0 && (
        <>
          <div className="stat-banner">
            <span className="stat-banner-label">これまでの総売上</span>
            <span className="stat-banner-value">{yen(grandTotal)}</span>
            <span className="stat-banner-sub">
              全 {eventCount} イベント・{productCount} 商品を集計
            </span>
          </div>
          <div className="summary-grid">
            <SummaryTile label="総販売数" value={`${grandSold} 点`} accent="indigo" />
            <SummaryTile label="残り在庫" value={`${grandRemaining} 点`} accent="plum" />
            <SummaryTile label="開催イベント数" value={`${eventCount} 件`} accent="gold" />
          </div>
          <button className="ghost-btn csv-btn" onClick={handleExportCsv}>
            <CsvIcon /> 売上データをCSV出力
          </button>
        </>
      )}

      {events.length === 0 ? (
        <EmptyState
          icon="star"
          title="まだイベントがありません"
          body="「新しいイベントを作成」から、出店イベントごとのページを作ってみましょう。"
        />
      ) : (
        <div className="card-list">
          {events.map((e) => {
            const sold = e.products.reduce((s, p) => s + p.cells.filter(Boolean).length, 0);
            const stock = e.products.reduce((s, p) => s + p.stock, 0);
            const revenue = e.products.reduce(
              (s, p) => s + p.cells.filter(Boolean).length * p.price,
              0
            );
            return (
              <div key={e.id} className="event-card" onClick={() => onOpen(e.id)}>
                <div className="event-card-main">
                  <h3>{e.name || "無題のイベント"}</h3>
                  <p className="muted">
                    {[e.date, e.venue].filter(Boolean).join(" ・ ") || "日付・会場未設定"}
                  </p>
                  <div className="event-card-stats">
                    <span>商品 {e.products.length}種</span>
                    <span>販売 {sold}/{stock}</span>
                  </div>
                </div>
                <div className="event-card-side">
                  <span className="event-revenue">{yen(revenue)}</span>
                  <button
                    className="icon-btn danger"
                    aria-label="イベントを削除"
                    onClick={(ev) => {
                      ev.stopPropagation();
                      onDelete(e.id);
                    }}
                  >
                    <TrashIcon />
                  </button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      <button className="fab" onClick={onAdd}>
        <PlusIcon /> 新しいイベントを作成
      </button>
    </div>
  );
}

/* --------------------------- Event Detail View ---------------------------- */

function EventDetailView({ event, onOpenProduct, onAddProduct, onDeleteProduct }) {
  const totalSold = event.products.reduce((s, p) => s + p.cells.filter(Boolean).length, 0);
  const totalStock = event.products.reduce((s, p) => s + p.stock, 0);
  const totalRevenue = event.products.reduce(
    (s, p) => s + p.cells.filter(Boolean).length * p.price,
    0
  );

  return (
    <div className="view-pad">
      <div className="summary-grid">
        <SummaryTile label="総売上" value={yen(totalRevenue)} accent="gold" />
        <SummaryTile label="販売数" value={`${totalSold} 点`} accent="indigo" />
        <SummaryTile label="残り在庫" value={`${totalStock - totalSold} 点`} accent="plum" />
      </div>

      {event.products.length === 0 ? (
        <EmptyState
          icon="square"
          title="商品がまだ登録されていません"
          body="「商品を追加」から、頒布する本やグッズを登録しましょう。"
        />
      ) : (
        <div className="card-list">
          {event.products.map((p) => {
            const sold = p.cells.filter(Boolean).length;
            const remaining = p.stock - sold;
            const pct = p.stock > 0 ? Math.round((sold / p.stock) * 100) : 0;
            return (
              <div key={p.id} className="product-card" onClick={() => onOpenProduct(p.id)}>
                <Seal shape={p.shape} color={p.color} pattern={p.pattern} filled size={38} />
                <div className="product-card-main">
                  <h3>{p.name || "無題の商品"}</h3>
                  <p className="muted">{yen(p.price)} ／点</p>
                  <div className="progress-track">
                    <div
                      className="progress-fill"
                      style={{ width: `${pct}%`, background: p.color }}
                    />
                  </div>
                  <div className="product-card-stats">
                    <span>残り {remaining}</span>
                    <span>販売 {sold}/{p.stock}</span>
                  </div>
                </div>
                <div className="product-card-side">
                  <span className="event-revenue small">{yen(sold * p.price)}</span>
                  <button

                      ev.stopPropagation();
                      onDeleteProduct(p.id);
                    }}
                  >

                  </button>
                </div>
              </div>
            );
          })}
        </div>
      )}

}

/* -------------------------- Product Detail View ---------------------------- */

function ProductDetailView({ event, product, onToggleCell, onSell, onAddStock, onReset, onDelete }) {
  const sold = product.cells.filter(Boolean).length;
  const remaining = product.stock - sold;
  const revenue = sold * product.price;

  const [qty, setQty] = useState(1);
  const [received, setReceived] = useState("");

  useEffect(() => {
    if (qty > Math.max(remaining, 1)) setQty(Math.max(1, remaining));
  }, [remaining]); // eslint-disable-line

  const subtotal = qty * product.price;
  const receivedNum = received === "" ? null : Number(received);
  const change = receivedNum !== null && !Number.isNaN(receivedNum) ? receivedNum - subtotal : null;
  const insufficient = change !== null && change < 0;

  function confirmSale() {
    if (qty < 1 || qty > remaining) return;
    onSell(qty);
    setReceived("");
    setQty(1);
  }

  return (
    <div className="view-pad">
      <div className="product-hero">
        <Seal shape={product.shape} color={product.color} pattern={product.pattern} filled size={54} />
        <div className="product-hero-text">
          <h2>{product.name || "無題の商品"}</h2>
          <p className="muted">{yen(product.price)} ／点・全 {product.stock} 点</p>
        </div>
      </div>

      <div className="summary-grid">
        <SummaryTile label="売上" value={yen(revenue)} accent="gold" />
        <SummaryTile label="販売数" value={`${sold} 点`} accent="indigo" />
        <SummaryTile label="残り" value={`${remaining} 点`} accent="plum" />
      </div>

      {/* グリッド */}
      <section className="grid-card">
        <div className="grid-card-head">
          <h3 className="section-title" style={{ margin: 0 }}>在庫マス目（タップで記録／取消）</h3>
          <span className="grid-legend">■塗りつぶし＝販売済み　□枠のみ＝在庫あり</span>
        </div>
        <div className="cell-grid">
          {product.cells.map((filled, i) => (
            <button
              key={i}
              className={`cell-btn ${filled ? "cell-filled" : ""}`}
              onClick={() => onToggleCell(i)}
              aria-pressed={filled}
              aria-label={`${i + 1}番目 ${filled ? "販売済み・タップで取消" : "在庫あり・タップで販売記録"}`}
            >
              <Seal shape={product.shape} color={product.color} pattern={product.pattern} filled={filled} size="100%" />
            </button>
          ))}
        </div>
      </section>

      {/* おつり計算機 */}
      <section className="calc-card">
        <h3 className="section-title">会計・おつり計算</h3>

        <div className="calc-row">
          <span className="calc-label">数量</span>
          <div className="stepper">
            <button
              className="stepper-btn"
              onClick={() => setQty((q) => Math.max(1, q - 1))}
              aria-label="数量を減らす"
            >
              −
            </button>
            <span className="stepper-value">{qty}</span>
            <button
              className="stepper-btn"
              onClick={() => setQty((q) => Math.min(Math.max(remaining, 1), q + 1))}
              aria-label="数量を増やす"
            >
              ＋
            </button>
          </div>
        </div>

        <div className="calc-row">
          <span className="calc-label">小計</span>
          <span className="calc-subtotal">{yen(subtotal)}</span>
        </div>

        <label className="calc-row calc-input-row">
          <span className="calc-label">お預かり金額</span>
          <input
            type="number"
            inputMode="numeric"
            placeholder="例）1000"
            value={received}
            onChange={(e) => setReceived(e.target.value)}
            className="calc-input"
          />
        </label>

        <div className={`change-display ${insufficient ? "change-warn" : ""}`}>
          <span className="change-display-label">
            {insufficient ? <WarnIcon /> : <CheckIcon />}
            おつり
          </span>
          <strong>{change === null ? "―" : insufficient ? "金額不足" : yen(change)}</strong>
        </div>

        <button
          className="primary-btn"
          disabled={remaining <= 0 || qty > remaining}
          onClick={confirmSale}
        >
          {remaining <= 0 ? "在庫切れです" : `${qty}点の販売を記録してシールを貼る`}
        </button>
      </section>

      <section className="danger-zone">
        <button className="ghost-btn" onClick={() => onAddStock(10)}>在庫を＋10部 追加する</button>
        <button className="ghost-btn" onClick={onReset}>販売記録をリセット</button>
        <button className="ghost-btn danger-text" onClick={onDelete}>この商品を削除</button>
      </section>
    </div>
  );
}

      }
      .section-title { font-size: 14.5px; font-weight: 900; }
      .calc-row { display: flex; align-items: center; justify-content: space-between; }
      .calc-label { font-size: 13.5px; font-weight: 700; color: var(--ink-soft); }
      .stepper { display: flex; align-items: center; gap: 12px; }
      .stepper-btn {
        width: 38px; height: 38px; border-radius: 10px; border: 2px solid var(--accent);
        background: var(--surface); color: var(--accent); font-size: 19px; font-weight: 900;
        display: flex; align-items: center; justify-content: center;
      }
      .stepper-btn:active { transform: scale(0.9); }
      .stepper-value { font-size: 18px; font-weight: 900; min-width: 28px; text-align: center; }
      .calc-subtotal { font-size: 17px; font-weight: 900; color: var(--accent); }

      .calc-input-row { flex-direction: row; }
      .calc-input {
        width: 130px; text-align: right; border: 2px solid var(--border); border-radius: var(--radius-sm);
        padding: 9px 10px; font-size: 16px; font-weight: 700; background: #fff; color: var(--ink);
      }
      .calc-input:focus { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

      .change-display {
        background: var(--gold-bg); border-radius: var(--radius-md);
        padding: 12px 14px; display: flex; align-items: center; justify-content: space-between;
        border: 2px solid #DEC170;
      }
      .change-display span { font-size: 13px; font-weight: 700; color: #6B4E10; }
      .change-display-label { display: flex; align-items: center; gap: 5px; }
      .change-display strong { font-size: 21px; font-weight: 900; color: var(--gold); font-family: 'Zen Maru Gothic', sans-serif; }
      .change-display.change-warn { background: var(--danger-bg); border-color: #C98A78; }
      .change-display.change-warn strong { color: var(--danger); font-size: 15px; }
      .change-display.change-warn span { color: #7A3323; }

      /* ---------- Grid ---------- */
      .grid-card-head { display: flex; flex-direction: column; gap: 4px; }
      .grid-legend { font-size: 11px; color: var(--ink-soft); font-weight: 600; }
      .cell-grid {
        display: grid; grid-template-columns: repeat(5, 1fr);
        gap: 6px;
      }
      .cell-btn {
        aspect-ratio: 1; width: 100%; min-height: 0; border-radius: 12px; border: none; background: transparent;
        display: flex; align-items: center; justify-content: center;
        padding: 1px;
        transition: transform .1s ease;
      }
      .cell-btn svg { width: 100%; height: 100%; display: block; }
      .cell-btn:active { transform: scale(0.85); }
      .cell-btn.cell-filled { animation: stampPop .28s ease; }

      @keyframes stampPop {
        0% { transform: scale(0.5) rotate(-8deg); opacity: 0.4; }
        60% { transform: scale(1.18) rotate(4deg); }
        100% { transform: scale(1) rotate(0deg); opacity: 1; }
      }

      .danger-zone { display: flex; flex-direction: column; gap: 8px; }

      /* ---------- Modals ---------- */
      .modal-overlay {
        position: fixed; inset: 0; background: rgba(52,40,27,0.45);
        display: flex; align-items: flex-end; justify-content: center; z-index: 50;
        padding: 0;
      }
      .modal-sheet {
        background: var(--bg); width: 100%; max-width: 560px;
        border-radius: 22px 22px 0 0; max-height: 88vh; overflow-y: auto;
        padding: 18px 18px 26px; box-shadow: 0 -10px 30px rgba(0,0,0,0.25);
      }
      .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
      .modal-head h2 { font-size: 17px; font-weight: 900; }
      .modal-body { display: flex; flex-direction: column; gap: 14px; }

      .field { display: flex; flex-direction: column; gap: 6px; flex: 1; }
      .field span { font-size: 12.5px; font-weight: 700; color: var(--ink-soft); }
      .field-input {
        border: 2px solid var(--border); border-radius: var(--radius-sm);
        padding: 12px; font-size: 15px; background: #fff; color: var(--ink); width: 100%;
      }
      .field-input:focus { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
      .field-row { display: flex; gap: 10px; }

      .seal-preview-row {
        display: flex; align-items: center; gap: 12px; background: var(--surface);
        border: 2px solid var(--border); border-radius: var(--radius-md); padding: 12px;
      }
      .seal-preview-row .muted { line-height: 1.5; }

      .picker-block { display: flex; flex-direction: column; gap: 8px; }
      .picker-label { font-size: 12.5px; font-weight: 700; color: var(--ink-soft); }
      .picker-row { display: flex; gap: 8px; flex-wrap: wrap; }
      .picker-chip {
        display: flex; align-items: center; gap: 6px;
        border: 2px solid var(--border); background: var(--surface); border-radius: 999px;
        padding: 7px 12px 7px 8px; font-size: 12.5px; font-weight: 700; color: var(--ink);
      }
      .picker-chip-active { border-color: var(--accent); background: #E4ECF1; color: var(--accent-dark); }

      .color-chip {
        width: 34px; height: 34px; border-radius: 10px; border: 3px solid var(--surface);
        box-shadow: 0 0 0 2px var(--border);
      }
      .color-chip-active { box-shadow: 0 0 0 2px var(--ink); }

      .confirm-message { font-size: 14px; line-height: 1.7; color: var(--ink-soft); font-weight: 500; }
      .confirm-actions { display: flex; gap: 10px; }
      .confirm-actions .ghost-btn, .confirm-actions .primary-btn { flex: 1; }

      @media (min-width: 460px) {
        .modal-overlay { align-items: center; }
        .modal-sheet { border-radius: 22px; }
      }
    `}</style>
  );
}


/* ------------------------------- Mount ----------------------------------- */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
</html>
